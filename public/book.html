<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Consultation | IronLinks</title>

<link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<style>
#calendar {
  max-width: 900px;
  margin: 30px auto;
  background: #fff;
  padding: 15px;
  border-radius: 12px;
}

.fc-day.available:hover {
  background: #e8f5e9;
  cursor: pointer;
}

.fc-day.selected {
  background: #c8e6c9 !important;
}
</style>
</head>

<body>

<header>
  <h1>Iron <span>works</span></h1>
</header>

<section class="book-section">
  <h2>Book a Consultation</h2>

  <div id="calendar"></div>

  <form id="bookingForm" class="book-form" enctype="multipart/form-data">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="tel" name="phone" placeholder="09XXXXXXXXX" required>

    <input type="date" name="date" id="dateInput" required>
    <input type="time" name="time" required>

    <textarea name="request" placeholder="Additional details"></textarea>
    <button type="submit">Submit Booking</button>
  </form>
</section>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const dateInput = document.getElementById('dateInput');

  const res = await fetch('/bookings');
  const bookings = res.ok ? await res.json() : [];
  const bookedDates = bookings.map(b => b.date);

  const calendar = new FullCalendar.Calendar(
    document.getElementById('calendar'),
    {
      initialView: 'dayGridMonth',
      height: 'auto',
      validRange: {
        start: new Date().toISOString().split('T')[0]
      },

      events: bookedDates.map(d => ({
        start: d,
        allDay: true,
        display: 'background',
        backgroundColor: '#f8d7da'
      })),

      dayCellDidMount(info) {
        if (!bookedDates.includes(info.dateStr)) {
          info.el.classList.add('available');
        }
      },

      dateClick(info) {
        if (bookedDates.includes(info.dateStr)) return;

        document
          .querySelectorAll('.fc-day.selected')
          .forEach(d => d.classList.remove('selected'));

        info.dayEl.classList.add('selected');
        dateInput.value = info.dateStr;
      }
    }
  );

  calendar.render();
});
</script>

</body>
</html>
