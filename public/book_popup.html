<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Consultation | IronLinks</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/book_popup.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<section class="book-section">

<h2>Book Appointment Consultation</h2>

<div class="legend">
<span><div class="box box-approved"></div>Unavailable</span>
<span><div class="box box-pending"></div>Pending</span>
<span><div class="box box-selected"></div>Selected</span>
</div>

<div id="calendar"></div>
<div id="popupOverlay" class="popup-overlay hidden"></div>

<div id="timePopup" class="time-popup hidden">
<h3>Select Time</h3>
<div id="timeSlots"></div>
<button onclick="closeTimePopup()">Close</button>
</div>

<!-- =========================
GENERATED IMAGE PREVIEW
========================= -->

<div id="generatedPreview" class="generated-preview">

<h3>Selected Design</h3>

<img 
id="bookingPreview"
style="
display:none;
width:100%;
max-height:250px;
object-fit:contain;
border-radius:10px;
margin-top:10px;
">

<h4>Estimated Cost</h4>

<div id="estimatedCostPreview" class="cost-preview">
₱ 0
</div>

</div>



<form id="bookingForm" class="book-form">

<div class="form-group">
<label>Name</label>
<input type="text" id="userName" readonly>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="userEmail" readonly>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="tel" name="phone" placeholder="09XXXXXXXXX" required>
</div>

<div class="form-group">
<label>Date</label>
<input type="date" id="dateInput" required readonly>
</div>

<div class="form-group full">
<label>Time</label>
<select name="time" required>

<option value="">Select Time</option>

<option value="08:00">08:00 AM</option>
<option value="09:00">09:00 AM</option>
<option value="10:00">10:00 AM</option>
<option value="11:00">11:00 AM</option>

<option value="13:00">01:00 PM</option>
<option value="14:00">02:00 PM</option>
<option value="15:00">03:00 PM</option>
<option value="16:00">04:00 PM</option>

</select>
</div>

<div class="form-group full">
<label>Additional Details</label>
<textarea 
name="request" 
placeholder="Additional details">
</textarea>
</div>

<div class="form-group full">
<label>Upload Reference Image</label>
<input 
type="file" 
id="referenceImage" 
accept="image/*"
>
</div>

<button type="submit">
Submit Booking
</button>

</form>

</section>


<script src="js/book_popup.js"></script>

</body>
</html>
