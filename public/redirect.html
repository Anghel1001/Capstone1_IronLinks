<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preview in AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      font-family:system-ui,Arial;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      margin:0;
      background:#111;
      color:#eee;
      padding:16px
    }

    .box{
      max-width:720px;
      text-align:center
    }

    .error{color:#ff6b6b}

    .btn{
      display:inline-block;
      margin-top:16px;
      padding:10px 18px;
      background:#1976d2;
      color:#fff;
      border-radius:8px;
      text-decoration:none;
      border:none;
      font-size:15px;
    }

    .steps{
      text-align:left;
      max-width:400px;
      margin:20px auto;
      line-height:1.6;
    }
  </style>
</head>

<body>

  <div class="box" id="box">
    <h2>Preview Your Gate in AR</h2>

    <div class="steps">
      <p>• Move your phone slowly</p>
      <p>• Point at a flat ground surface</p>
      <p>• Tap to place the gate</p>
    </div>

    <button class="btn" onclick="launchAR()">Start AR</button>
  </div>

<script>
(async function(){

  // MODEL REGISTRY
  const MODELS = {
    "gate1": { 
      glb: "/models/gate1.glb",
      usdz: "/models/gate1.usdz?v=2" 
    },
  };

  function getQueryParam(name, fallback) {
    const p = new URLSearchParams(location.search);
    return p.get(name) || fallback;
  }

  const modelKey = getQueryParam('model','gate1');
  const model = MODELS[modelKey];
  const box = document.getElementById('box');

  if (!model) {
    box.innerHTML = `<h2 class="error">Unknown model: ${modelKey}</h2>
      <p>Ensure the model key exists in the MODELS registry.</p>`;
    return;
  }

  const origin = location.origin;
  const glbUrl = origin + model.glb;
  const usdzUrl = origin + model.usdz;

  // MAKE launchAR GLOBAL
  window.launchAR = function() {

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    const isAndroid = /Android/i.test(ua);
    const isIOSUA = /iPad|iPhone|iPod/i.test(ua);
    const isTouchDevice =
      ('ontouchstart' in window) ||
      (navigator.maxTouchPoints > 1);

    const isLikelyIOS = isIOSUA || (isTouchDevice && /Macintosh/i.test(ua));

    // iOS Quick Look
    if (isLikelyIOS) {

      const a = document.createElement('a');
      a.setAttribute('rel','ar');
      a.href = usdzUrl;
      document.body.appendChild(a);

      try {
        a.click();
        setTimeout(()=>{ window.location.replace(usdzUrl); }, 900);
      } catch(e) {
        window.location.replace(usdzUrl);
      }

      return;
    }

    // Android Scene Viewer
    if (isAndroid) {

      const title = encodeURIComponent('IronLinks Model - ' + modelKey);
      const file = encodeURIComponent(glbUrl);
      const fallback = encodeURIComponent(glbUrl);

      const intent = 
        `intent://arvr.google.com/scene-viewer/1.0?file=${file}&title=${title}&mode=ar_preferred` +
        `#Intent;scheme=https;package=com.google.android.googlequicksearchbox;` +
        `action=android.intent.action.VIEW;S.browser_fallback_url=${fallback};end`;

      window.location.replace(intent);
      return;
    }

    alert("Please open this link on a mobile device.");
  };

})();
</script>

</body>
</html>
