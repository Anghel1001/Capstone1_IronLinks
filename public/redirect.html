<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preview in AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      font-family:system-ui,Arial;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      margin:0;
      background:#111;
      color:#eee;
      padding:16px
    }

    .box{
      max-width:720px;
      text-align:center
    }

    .error{color:#ff6b6b}

    .btn{
      display:inline-block;
      margin-top:16px;
      padding:12px 20px;
      background:#1976d2;
      color:#fff;
      border-radius:8px;
      border:none;
      font-size:16px;
      cursor:pointer;
      z-index:20;
      position:relative;
    }

    .steps{
      text-align:left;
      max-width:400px;
      margin:20px auto;
      line-height:1.6;
    }
  </style>
</head>

<body>

  <div class="box" id="box">
    <h2>Preview Your Gate in AR</h2>

    <div class="steps">
      <p>• Move your phone slowly</p>
      <p>• Point at a flat ground surface</p>
      <p>• Tap to place the gate</p>
      <p>• Drag to move the gate</p>
      <p>• Pinch to resize and rotate</p>
    </div>

    <button type="button" class="btn" onclick="launchAR()">Start AR</button>
  </div>

<script src="js/redirect.js"></script>
</body>
</html>
