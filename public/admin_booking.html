<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Bookings | IronLinks</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/admin_booking.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

</head>

<body>

<header>
<h1>Galubs <span>Ironworks</span></h1>
<nav>
<a href="index.html">View Public Page</a> |
<a href="admin.html">Admin Profile</a> |
<a href="admin_booking.html">Schedules</a>
</nav>
</header>

<section>
<h2 style="text-align:center;">Booking Calendar</h2>

<div class="calendar-legend">
  <div class="legend-item"><span class="dot approved"></span> Approved</div>
  <div class="legend-item"><span class="dot pending"></span> Pending</div>
  <div class="legend-item"><span class="dot rejected"></span> Rejected</div>
</div>

<div id="admin-calendar"></div>
</section>

<div class="filter-container">

    <div class="toolbar">

    <div class="filter-group">
        <label for="statusFilter">Status</label>

        <select id="statusFilter" onchange="renderTable()">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
        </select>
    </div>

    <div class="search-group">
        <label for="searchBooking">Search</label>

        <input
            type="text"
            id="searchBooking"
            placeholder="Search customer..."
            onkeyup="renderTable()">
    </div>

</div>
</select>

</div>

<section class="table-wrapper">
<h2 id="tableTitle">Bookings</h2>

<table id="bookingsTable">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Date</th>
<th>Time</th>
<th>Status</th>
<th>Reference</th>
</tr>
</thead>
<tbody></tbody>
</table>
</section>

<!-- BOOKING POPUP -->
<div id="bookingPopup" class="popup">
<h3 id="popupName"></h3>
<p id="popupDate"></p>
<p id="popupTime"></p>
<p id="popupStatus"></p>

<div class="popup-actions">
<button id="approveBtn" class="btn-approve">Approve</button>
<button id="rejectBtn" class="btn-reject">Reject</button>
</div>

<button class="close-btn" onclick="closePopup()">✕</button>
</div>

<div id="popupOverlay" class="overlay"></div>

<!-- IMAGE MODAL -->
<div id="modal" class="modal">
<img id="modalImg">
</div>

<input
    type="text"
    id="searchBooking"
    placeholder="Search by name..."
    onkeyup="renderTable()">

<script src="js/admin_booking.js"></script>

</body>
</html>
