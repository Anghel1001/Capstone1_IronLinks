<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book ConsultationBook ConsultationBook Consultation | IronLinks</title>

<link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

#calendar {
max-width: 100%;
margin: 20px auto;
background: #fff;
padding: 15px;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.fc-day.selected {
background: #c8e6c9 !important;
}

.book-section {
max-width: 600px;
margin: 50px auto;
padding: 30px 20px;
background-color: #f9f9f9;
border-radius: 15px;
box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.book-form{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
margin-top:20px;
}

.book-form textarea{
grid-column:1/-1;
min-height:80px;
}

.book-form button{
grid-column:1/-1;
padding:12px;
background:#1e293b;
color:white;
border:none;
cursor:pointer;
border-radius:6px;
}

.status-message {
margin-top: 16px;
font-weight: 600;
}

.status-pending { color: #856404; }
.status-success { color: #155724; }
.status-error { color: #721c24; }

.hidden { display:none; }

.switch{
text-align:center;
cursor:pointer;
color:#1e293b;
}

.legend {
display:flex;
gap:16px;
justify-content:center;
margin-bottom:10px;
font-size:14px;
}

.legend span {
display:flex;
align-items:center;
gap:6px;
}

.box {
width:14px;
height:14px;
border-radius:3px;
}

.box-approved { background: #dc3545; }
.box-pending { background: #fd7e14; }
.box-selected { background: #28a745; }

</style>

</head>

<body>

<header>
<h1>Iron <span>works</span></h1>
<nav>
<a href="index.html">about us</a> |
<a href="products.html">products</a> |
<a href="book.html">book now</a> |
<a href="#contact">contact</a>
</nav>
</header>

<!-- AUTH -->

<div id="authSection" class="auth-box">
<h3 id="authTitle">Login</h3>

<input type="text" id="authName" placeholder="Full Name" class="hidden">
<input type="email" id="authEmail" placeholder="Email">
<input type="password" id="authPassword" placeholder="Password">

<button type="button" onclick="handleAuth()">Login</button>

<p class="switch" onclick="toggleAuth()">Create account</p>
</div>

<!-- BOOKING -->

<section id="bookingSection" class="book-section hidden">

<h2>Book Consultation</h2>

<button onclick="logout()">Logout</button>

<div class="legend">
<span><div class="box box-approved"></div>Unavailable</span>
<span><div class="box box-pending"></div>Pending</span>
<span><div class="box box-selected"></div>Selected</span>
</div>

<div id="calendar"></div>

<form id="bookingForm" class="book-form">

<input type="text" id="userName" readonly>
<input type="email" id="userEmail" readonly>

<input type="tel" name="phone" placeholder="09XXXXXXXXX" required>

<input type="date" id="dateInput" required readonly>

<select name="time" required>
<option value="">Select Time</option>
<option value="08:00">08:00 AM</option>
<option value="09:00">09:00 AM</option>
<option value="10:00">10:00 AM</option>
<option value="11:00">11:00 AM</option>
<option value="13:00">01:00 PM</option>
<option value="14:00">02:00 PM</option>
<option value="15:00">03:00 PM</option>
<option value="16:00">04:00 PM</option>
</select>

<textarea name="request" placeholder="Additional details"></textarea>

<button type="submit">Submit Booking</button>

</form>

<div id="statusMessage" class="status-message"></div>

</section>

<script>

const supabaseUrl = "https://ntuikmoiajlqlzehqwkw.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50dWlrbW9pYWpscWx6ZWhxd2t3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0NTQ2MjUsImV4cCI6MjA3OTAzMDYyNX0.Zxrk09S04mRqjbCih9MlZ43YPaw6VUV0obR9qzxQ2Fk";

const { createClient } = supabase;
const supabaseClient = createClient(supabaseUrl, supabaseKey);

let isLogin = true;

function toggleAuth(){
isLogin = !isLogin;

document.getElementById("authTitle").textContent =
isLogin ? "Login" : "Register";

document.querySelector(".auth-box button").textContent =
isLogin ? "Login" : "Register";

document.querySelector(".switch").textContent =
isLogin ? "Create account" : "Already have account?";

document.getElementById("authName").classList.toggle("hidden");
}

async function handleAuth(){

const name = authName.value;
const email = authEmail.value;
const password = authPassword.value;

if(!isLogin){

const { data, error } =
await supabaseClient
.from("users")
.insert([{name,email,password}])
.select()
.single();

if(error){
alert(error.message);
return;
}

localStorage.setItem("user",JSON.stringify(data));
loadUser();
return;
}

const { data,error } =
await supabaseClient
.from("users")
.select("*")
.eq("email",email);

if(!data.length){
alert("User not found");
return;
}

if(data[0].password !== password){
alert("Wrong password");
return;
}

localStorage.setItem("user",JSON.stringify(data[0]));
loadUser();

}

function loadUser(){

const user =
JSON.parse(localStorage.getItem("user"));

if(!user) return;

authSection.classList.add("hidden");
bookingSection.classList.remove("hidden");

userName.value = user.name;
userEmail.value = user.email;

initCalendar();

}

function logout(){
localStorage.removeItem("user");
location.reload();
}

async function initCalendar(){

const { data:bookings } =
await supabaseClient
.from("bookings")
.select("*");

const calendar =
new FullCalendar.Calendar(
calendarEl=document.getElementById("calendar"),
{
initialView:"dayGridMonth",
height:"auto",

validRange:{
start:new Date().toISOString().split("T")[0]
},

events: bookings.map(b=>({
title:formatTime(b.time),
start:b.date,
color:b.status==="approved"
?"#dc3545"
:"#fd7e14"
})),

dateClick(info){

document
.querySelectorAll(".fc-day.selected")
.forEach(d=>d.classList.remove("selected"));

info.dayEl.classList.add("selected");
dateInput.value = info.dateStr;

}

});

calendar.render();

bookingForm.addEventListener("submit",
async e=>{

e.preventDefault();

const user =
JSON.parse(localStorage.getItem("user"));

await supabaseClient
.from("bookings")
.insert([{
name:user.name,
email:user.email,
phone:bookingForm.phone.value,
date:dateInput.value,
time:bookingForm.time.value,
request:bookingForm.request.value,
status:"pending"
}]);

location.reload();

});

}

function formatTime(time24){
const [hour,minute] = time24.split(":");
let h=parseInt(hour);
const ampm = h>=12?"PM":"AM";
h = h%12 || 12;
return `${h}:${minute} ${ampm}`;
}

loadUser();

</script>

</body>
</html>
