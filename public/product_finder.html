<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Design Finder | IronLinks</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Open+Sans&display=swap" rel="stylesheet">

<style>
/* -------------------------
   LOCAL STYLES (SAFE)
-------------------------- */
.product-section {
  padding: 60px 10%;
}

.product-container {
  display: flex;
  gap: 40px;
  flex-wrap: wrap;
}

.product-image {
  flex: 1;
  min-width: 300px;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 20px;
  background: #fafafa;
  text-align: center;
}

.product-details {
  flex: 1;
  min-width: 300px;
}

.product-details label {
  display: block;
  margin-top: 15px;
  font-weight: 600;
}

.product-details textarea {
  width: 100%;
  min-height: 120px;
  padding: 10px;
  margin-top: 5px;
  font-family: 'Open Sans', sans-serif;
}

.product-details input[type="file"] {
  margin-top: 8px;
}

.quote-btn {
  margin-top: 20px;
  padding: 12px 25px;
  background: black;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.quote-btn:disabled {
  background: #666;
  cursor: not-allowed;
}

.spinner {
  width: 50px;
  height: 50px;
  border: 6px solid #eee;
  border-top: 6px solid #000;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 30px auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.disclaimer {
  font-size: 12px;
  color: #777;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <h1>Iron <span>works</span></h1>
  <nav>
    <a href="index.html">about us</a> |
    <a href="products.html">products</a> |
    <a href="book.html">book now</a> |
    <a href="#contact">contact</a>
  </nav>
</header>

<section class="product-section">
  <h2>Custom Ironwork Design Finder</h2>

  <div class="product-container">

    <!-- RESULT / IMAGE -->
    <div class="product-image">
      <div id="result">
        🧩 No design generated yet
      </div>
    </div>

    <!-- INPUTS -->
    <div class="product-details">

      <label>Upload reference image (optional)</label>
      <input type="file" id="referenceImage" accept="image/*">

      <label>Describe your design</label>
      <textarea
        id="description"
        placeholder="Example: Modern black wrought iron gate with ornamental curves and medium density bars">
      </textarea>

      <button class="quote-btn" id="generateBtn">
        Generate Design
      </button>

      <p class="disclaimer">
        AI-generated images are for conceptual reference only.
        Final designs are reviewed by the ironworks professional.
      </p>

    </div>

  </div>
</section>

<footer id="contact">
  <p>© 2025 IronLinks. All Rights Reserved.</p>
</footer>

<script>
const generateBtn = document.getElementById("generateBtn");
const result = document.getElementById("result");
const description = document.getElementById("description");
const referenceImage = document.getElementById("referenceImage");

generateBtn.addEventListener("click", async () => {
  if (!description.value.trim()) {
    alert("Please describe your design.");
    return;
  }

  generateBtn.disabled = true;

  result.innerHTML = `
    <div class="spinner"></div>
    <p>AI is generating your design…</p>
  `;

  try {
    const formData = new FormData();
    formData.append("description", description.value);

    if (referenceImage.files[0]) {
      formData.append("reference_image", referenceImage.files[0]);
    }

    const res = await fetch("/design-finder", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (!data.success) {
      throw new Error("Generation failed");
    }

    result.innerHTML = `
      <img
        src="${data.generated_image}"
        alt="Generated ironwork design"
        style="width:100%; border-radius:10px;"
      >
      <p><small>✔ AI design generated</small></p>
    `;

  } catch (err) {
    console.error(err);
    result.innerHTML = "❌ Failed to generate design. Please try again.";
  }

  generateBtn.disabled = false;
});
</script>

</body>
</html>
