<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Bookings | IronLinks</title>

<link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<style>
#admin-calendar {
  max-width: 1100px;
  margin: 40px auto;
  background: white;
  padding: 20px;
  border-radius: 14px;
}

.pending-list {
  max-width: 1100px;
  margin: 40px auto;
  background: #fff;
  padding: 20px;
  border-radius: 14px;
}

.pending-card {
  border: 1px solid #eee;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}

.pending-card h3 {
  margin-bottom: 8px;
}

.pending-details {
  font-size: 14px;
  color: #444;
  line-height: 1.6;
}

.pending-details strong {
  color: #000;
}

.pending-actions {
  margin-top: 12px;
}

.pending-actions button {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  background: #198754;
  color: #fff;
  cursor: pointer;
}

.pending-actions button:hover {
  background: #157347;
}

.img-thumb {
  width: 100px;
  margin-top: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
}
</style>
</head>

<body>

<header>
  <h1>Iron <span>works</span> Admin</h1>
</header>

<section class="admin-container">
  <h2>Booking Calendar</h2>
  <div id="admin-calendar"></div>
</section>

<section class="pending-list">
  <h2>Pending Bookings</h2>
  <div id="pendingContainer"></div>
</section>

<script>
async function loadAdminView() {
  const res = await fetch('/bookings');
  const bookings = await res.json();

  // ---------- CALENDAR ----------
  const calendarEl = document.getElementById('admin-calendar');
  calendarEl.innerHTML = '';

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    height: 'auto',
    events: bookings.map(b => ({
      title: b.name,
      start: b.date,
      allDay: true,
      color: b.status === 'approved' ? '#dc3545' : '#ffc107'
    }))
  });

  calendar.render();

  // ---------- PENDING LIST ----------
  const pendingContainer = document.getElementById('pendingContainer');
  pendingContainer.innerHTML = '';

  const pending = bookings.filter(b => b.status === 'pending');

  if (!pending.length) {
    pendingContainer.innerHTML = '<p>No pending bookings 🎉</p>';
    return;
  }

  pending.forEach(b => {
    const div = document.createElement('div');
    div.className = 'pending-card';

    div.innerHTML = `
      <h3>${b.name}</h3>

      <div class="pending-details">
        <strong>Email:</strong> ${b.email}<br>
        <strong>Phone:</strong> ${b.phone}<br>
        <strong>Date:</strong> ${b.date}<br>
        <strong>Time:</strong> ${b.time}<br>
        <strong>Request:</strong> ${b.request || '—'}
        ${
          b.reference_image_url
            ? `<br><strong>Reference Image:</strong><br>
               <a href="${b.reference_image_url}" target="_blank">
                 <img src="${b.reference_image_url}" class="img-thumb">
               </a>`
            : ''
        }
      </div>

      <div class="pending-actions">
        <button onclick="approveBooking(${b.id})">Approve Booking</button>
      </div>
    `;

    pendingContainer.appendChild(div);
  });
}

// ---------- APPROVE ----------
async function approveBooking(id) {
  await fetch(`/bookings/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'approved' })
  });

  loadAdminView();
}

document.addEventListener('DOMContentLoaded', loadAdminView);
</script>

</body>
</html>
