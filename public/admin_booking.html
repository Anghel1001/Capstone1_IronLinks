<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Bookings | IronLinks</title>

<link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<style>
#admin-calendar {
  max-width: 1100px;
  margin: 40px auto;
  background: white;
  padding: 20px;
  border-radius: 14px;
}

.table-wrapper {
  max-width: 1100px;
  margin: 40px auto;
  background: white;
  border-radius: 14px;
  padding: 20px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

th {
  background: #111;
  color: #fff;
}

.status-pending { color: #856404; }
.status-approved { color: #198754; }
.status-rejected { color: #dc3545; }

button {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  color: #fff;
  font-size: 13px;
}

.btn-approve { background: #198754; }
.btn-reject { background: #dc3545; }

.btn-approve:hover { background: #157347; }
.btn-reject:hover { background: #bb2d3b; }
</style>
</head>

<body>

<header>
  <h1>Iron <span>works</span> Admin</h1>
  <nav>
    <a href="index.html">view public page</a> |
    <a href="admin.html">admin profile</a> |
    <a href="admin_booking.html">Schedules</a>
  </nav>
</header>

<section>
  <h2 style="text-align:center;">Booking Calendar</h2>
  <div id="admin-calendar"></div>
</section>

<section class="table-wrapper">
  <h2>All Bookings (Database)</h2>
  <table id="bookingsTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Date</th>
        <th>Time</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<script>
async function loadAdmin() {
  try {
    const res = await fetch("/bookings");
    const bookings = await res.json();

    // ======================
    // CALENDAR
    // ======================
    const calendar = new FullCalendar.Calendar(
      document.getElementById("admin-calendar"),
      {
        initialView: "dayGridMonth",
        height: "auto",
        events: bookings.map(b => ({
          title: b.name,
          start: b.date,
          allDay: true,
          color:
            b.status === "approved" ? "#198754" :  // green
            b.status === "pending" ? "#ffc107" :   // yellow
            b.status === "rejected" ? "#dc3545" :  // red
            "#6c757d"
        }))
      }
    );

    calendar.render();

    // ======================
    // TABLE (FULL DATABASE)
    // ======================
    const tbody = document.querySelector("#bookingsTable tbody");
    tbody.innerHTML = "";

    bookings.forEach(b => {
      tbody.innerHTML += `
        <tr>
          <td>${b.name}</td>
          <td>${b.email}</td>
          <td>${b.phone}</td>
          <td>${b.date}</td>
          <td>${b.time}</td>
          <td class="status-${b.status}">${b.status}</td>
          <td>
            <button class="btn-approve" onclick="approve('${b.id}')">Accept</button>
            <button class="btn-reject" onclick="reject('${b.id}')">Reject</button>
          </td>
        </tr>
      `;
    });

  } catch (err) {
    console.error("Admin load error:", err);
  }
}

// ======================
// APPROVE
// ======================
async function approve(id) {
  await fetch(`/bookings/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: "approved" })
  });

  location.reload();
}

// ======================
// REJECT
// ======================
async function reject(id) {
  await fetch(`/bookings/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: "rejected" })
  });

  location.reload();
}

document.addEventListener("DOMContentLoaded", loadAdmin);
</script>

</body>
</html>
