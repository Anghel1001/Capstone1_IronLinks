<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Model Viewer Confirm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Model Viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }
    model-viewer {
      width: 100%;
      height: 500px;
      background: #ddd;
    }
  </style>
</head>

<body>

<h2>Model Viewer Test</h2>
<p>If the gate shows below, your model + server are OK.</p>

<model-viewer
  src="models/window.glb"
  alt="Iron Gate"
  auto-rotate
  camera-controls
  exposure="1"
  shadow-intensity="1">
</model-viewer>

</body>
</html>
