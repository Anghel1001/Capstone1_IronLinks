<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IronLinks Photo Placement</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/photo_view.css">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Open+Sans&display=swap" rel="stylesheet">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

</head>

<body>


    <div id="header"></div>



<section class="photo-section">

<h1 class="page-title">Photo Placement</h1>
<p class="page-subtitle">
Place Iron Gates, Grills, or Railings in your space
</p>


<div class="card">

<div class="steps">
<div class="step active">1 Upload Photo</div>
<div class="step">2 Select Corners</div>
<div class="step">3 Preview Model</div>
</div>


<div class="card-body">

<div class="left">

<h3>How it works:</h3>

<ul>
<li>Upload or capture a photo of your space.</li>
<li>Select four corners where structure should be placed.</li>
<li>Click Place Model.</li>
<li>Adjust model size and position.</li>
</ul>

<input type="file" id="imageInput" accept="image/*">

<div class="buttons">
<button class="place" id="placeBtn">Place Model</button>
<button class="reset" id="resetBtn">Reset</button>
</div>

</div>


<div class="right">
<canvas id="canvas"></canvas>
</div>


</div>

</div>

</section>

<script src="js/photo_view.js"></script>
<script src="js/header.js"></script>

</body>
</html>
