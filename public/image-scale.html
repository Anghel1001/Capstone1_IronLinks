<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Placement</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
  background: #f4f4f4;
}

.container {
  width: 100%;
  max-width: 700px;
  text-align: center;
}

h2 {
  margin-bottom: 20px;
}

#wrapper {
  position: relative;
  display: inline-block;
  width: 100%;
  max-width: 100%;
}

canvas {
  width: 100%;
  height: auto;
  border: 1px solid #000;
  display: block;
}

model-viewer {
  position: absolute;
  display: none;
  pointer-events: none;
  background: transparent;
}

input[type="file"] {
  margin-bottom: 20px;
}

.buttons {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

button {
  padding: 10px 16px;
  cursor: pointer;
  border: none;
  background: #222;
  color: white;
  border-radius: 6px;
  transition: 0.2s ease;
}

button:hover {
  background: #444;
}

/* Mobile adjustments */
@media (max-width: 600px) {
  body {
    padding: 15px;
  }

  button {
    width: 100%;
    max-width: 200px;
  }
}
</style>
</head>
<body>

<div class="container">
  <h2>Image Placement</h2>

  <input type="file" id="imageInput" accept="image/*">

  <div id="wrapper">
    <canvas id="canvas"></canvas>

    <model-viewer
      id="viewer"
      src="models/wall.glb"
      camera-controls
      exposure="1"
      shadow-intensity="1">
    </model-viewer>
  </div>

  <div class="buttons">
    <button id="placeBtn">Place Model</button>
    <button id="resetBtn">Reset Corners</button>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const imageInput = document.getElementById("imageInput");
const viewer = document.getElementById("viewer");
const placeBtn = document.getElementById("placeBtn");
const resetBtn = document.getElementById("resetBtn");

let img = new Image();
let corners = [];

/* IMAGE LOAD */
imageInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  img.src = URL.createObjectURL(file);

  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    reset();
  };
});

/* CORNER SELECTION */
canvas.addEventListener("click", (e) => {
  if (corners.length >= 4) return;

  const rect = canvas.getBoundingClientRect();

  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  corners.push({ x, y });
  drawCorners();
});

/* PLACE MODEL */
placeBtn.addEventListener("click", () => {

  if (corners.length !== 4) {
    alert("Select 4 corners first.");
    return;
  }

  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / canvas.width;
  const scaleY = rect.height / canvas.height;

  const xs = corners.map(p => p.x);
  const ys = corners.map(p => p.y);

  const minX = Math.min(...xs);
  const maxX = Math.max(...xs);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);

  // 🔥 Force clean rectangle shape
  const rectCorners = [
    { x: minX, y: minY },
    { x: maxX, y: minY },
    { x: maxX, y: maxY },
    { x: minX, y: maxY }
  ];

  corners = rectCorners;

  // Redraw corrected rectangle
  drawCorners();

  const displayLeft = minX * scaleX;
  const displayTop = minY * scaleY;
  const displayWidth = (maxX - minX) * scaleX;
  const displayHeight = (maxY - minY) * scaleY;

  viewer.style.display = "block";
  viewer.style.left = `${displayLeft}px`;
  viewer.style.top = `${displayTop}px`;
  viewer.style.width = `${displayWidth}px`;
  viewer.style.height = `${displayHeight}px`;

  viewer.style.pointerEvents = "auto";
  viewer.updateFraming?.();
});

/* RESET */
resetBtn.addEventListener("click", reset);

function reset() {
  corners = [];
  viewer.style.display = "none";
  viewer.style.pointerEvents = "none";

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0);
}

/* HELPERS */
function drawCorners() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0);

  ctx.fillStyle = "red";
  corners.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  if (corners.length === 4) {
    ctx.strokeStyle = "red";
    ctx.beginPath();
    ctx.moveTo(corners[0].x, corners[0].y);
    corners.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.stroke();
  }
}

function getBoundingBox() {
  const xs = corners.map(p => p.x);
  const ys = corners.map(p => p.y);

  return {
    minX: Math.min(...xs),
    maxX: Math.max(...xs),
    minY: Math.min(...ys),
    maxY: Math.max(...ys)
  };
}
</script>

</body>
</html>
