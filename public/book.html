<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Consultation | IronLinks</title>

<link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<style>
#calendar {
  max-width: 900px;
  margin: 30px auto;
  background: #fff;
  padding: 15px;
  border-radius: 12px;
}

.fc-day.selected {
  background: #c8e6c9 !important;
}

.status-message {
  margin-top: 16px;
  font-weight: 600;
}
.status-pending { color: #856404; }
.status-success { color: #155724; }
.status-error { color: #721c24; }

.legend {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-bottom: 10px;
  font-size: 14px;
}
.legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.box {
  width: 14px;
  height: 14px;
  border-radius: 3px;
}
.box-approved { background: #c8e6c9; }
.box-pending { background: #fff3cd; }
.box-selected { background: #c8e6c9; }
</style>
</head>

<body>

<header>
  <h1>Iron <span>works</span></h1>
  <nav>
    <a href="index.html">about us</a> |
    <a href="products.html">products</a> |
    <a href="book.html">book now</a> |
    <a href="#contact">contact</a>
  </nav>
</header>

<section class="book-section">
  <h2>Book a Consultation</h2>

  <div class="legend">
    <span><div class="box box-approved"></div> Approved</span>
    <span><div class="box box-pending"></div> Pending</span>
    <span><div class="box box-selected"></div> Selected</span>
  </div>

  <div id="calendar"></div>

  <form id="bookingForm" class="book-form" enctype="multipart/form-data">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="tel" name="phone" placeholder="09XXXXXXXXX" required>

    <input type="date" name="date" id="dateInput" required readonly>

    <!-- TIME SLOT DROPDOWN (STRICT 1 HOUR SLOTS) -->
    <select name="time" id="timeSelect" required>
      <option value="">Select Time</option>
      <option value="08:00">08:00 AM</option>
      <option value="09:00">09:00 AM</option>
      <option value="10:00">10:00 AM</option>
      <option value="11:00">11:00 AM</option>
      <option value="13:00">01:00 PM</option>
      <option value="14:00">02:00 PM</option>
      <option value="15:00">03:00 PM</option>
      <option value="16:00">04:00 PM</option>
    </select>

    <textarea name="request" placeholder="Additional details"></textarea>
    <button type="submit">Submit Booking</button>
  </form>

  <div id="statusMessage" class="status-message"></div>
</section>

<footer id="contact">
  <p>© 2025 IronLinks. All Rights Reserved.</p>
</footer>

<script>
document.addEventListener('DOMContentLoaded', async () => {

  const dateInput = document.getElementById('dateInput');
  const timeSelect = document.getElementById('timeSelect');
  const statusMessage = document.getElementById('statusMessage');
  const form = document.getElementById('bookingForm');

  try {
    const res = await fetch('/bookings');
    const bookings = await res.json();

    const approvedDates = bookings
      .filter(b => b.status === 'approved')
      .map(b => b.date);

    const pendingDates = bookings
      .filter(b => b.status === 'pending')
      .map(b => b.date);

    const calendar = new FullCalendar.Calendar(
      document.getElementById('calendar'),
      {
        initialView: 'dayGridMonth',
        height: 'auto',
        validRange: {
          start: new Date().toISOString().split('T')[0]
        },
        events: [
          ...approvedDates.map(d => ({
            start: d,
            display: 'background',
            backgroundColor: '#c8e6c9'
          })),
          ...pendingDates.map(d => ({
            start: d,
            display: 'background',
            backgroundColor: '#fff3cd'
          }))
        ],
        dateClick(info) {

          const selectedDate = new Date(info.dateStr);
          const day = selectedDate.getDay(); // 0 = Sunday

          if (day === 0) {
            alert("We are closed on Sundays.");
            return;
          }

          if (
            approvedDates.includes(info.dateStr) ||
            pendingDates.includes(info.dateStr)
          ) return;

          document.querySelectorAll('.fc-day.selected')
            .forEach(d => d.classList.remove('selected'));

          info.dayEl.classList.add('selected');
          dateInput.value = info.dateStr;
        }
      }
    );

    calendar.render();

  } catch (err) {
    console.error("Calendar load error:", err);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    statusMessage.textContent = "⏳ Booking submitted. Awaiting admin approval.";
    statusMessage.className = "status-message status-pending";

    const formData = new FormData(form);

    try {
      const submitRes = await fetch('/book', {
        method: 'POST',
        body: formData
      });

      if (!submitRes.ok) throw new Error();

      form.reset();

    } catch (err) {
      statusMessage.textContent = "❌ Booking failed. Please try again.";
      statusMessage.className = "status-message status-error";
    }
  });

});
</script>

</body>
</html>
